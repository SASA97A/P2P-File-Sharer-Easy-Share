<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http: https:;"
    />
    <title>Easy Share</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <div class="container app-shell">
      <!-- App Header & Local Device Identity -->
      <header class="app-header">
        <div class="header-left">
          <h1 class="app-title">Easy Share</h1>
          <span class="app-subtitle">High-speed P2P local file transfer</span>
        </div>
        <div class="device-identity-badge" id="myDeviceBadge" title="Your device identity on the network">
          <span class="identity-icon" id="myDeviceIcon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
          </span>
          <div class="identity-text">
            <span class="identity-name" id="myDeviceName">Detecting device...</span>
            <span class="identity-room" id="myDeviceRoom">Room: Public</span>
          </div>
        </div>
      </header>

      <!-- Room Configuration Bar -->
      <div class="room-bar">
        <div class="room-status">
          <span class="room-label">Active Room:</span>
          <span class="room-tag active-room-tag" id="currentRoomTag">Public (Default)</span>
        </div>
        <div class="room-input-group">
          <input
            type="text"
            id="roomIdInput"
            placeholder="Set Room (e.g. Design, Office, Home)"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="setRoomBtn" class="action-btn">Set Room</button>
        </div>
      </div>

      <!-- File Staging Area -->
      <div class="file-section">
        <div class="file-list" id="fileList"></div>
        <div
          class="drop-area compact"
          id="drop-area"
          tabindex="0"
          role="button"
          aria-label="Pick files or drop them here"
        >
          <img
            src="images/add_circle_48dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
            alt="add icon"
          />
          <span class="drop-text">Drag & drop files here, or click to browse</span>
          <input type="file" id="fileInput" multiple hidden />
        </div>
      </div>

      <!-- Manual Peer IP Input -->
      <div class="manual-add">
        <input
          type="text"
          id="manualIp"
          placeholder="Enter IP address (e.g. 192.168.1.42)"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="manualAddBtn">Add Device</button>
      </div>

      <!-- Discovered Devices Radar -->
      <div class="device-section">
        <div class="section-header">
          <h2 class="section-title">Nearby Devices</h2>
          <span class="device-count" id="deviceCount">0 found</span>
        </div>
        <div class="device-list" id="deviceList">
          <div class="loader">Searching for nearby devices...</div>
        </div>
      </div>

      <!-- Send Action Button -->
      <button class="send-btn" id="sendBtn" disabled>
        <div class="send-info">
          <span class="send-count">0 files</span>
          <span class="send-size">0 MB</span>
        </div>
        <div class="send-action">
          <span>Send</span>
        </div>
      </button>
    </div>

    <!-- Interactive Consent Modal for Incoming Transfers -->
    <div
      id="consent-modal"
      class="modal-overlay hidden"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="consentModalTitle"
    >
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-icon" id="consentSenderIcon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-laptop"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg>
          </div>
          <div class="modal-title-group">
            <h3 class="modal-title" id="consentModalTitle">Incoming File Transfer</h3>
            <span class="modal-subtitle" id="consentSenderInfo">Alice-PC (Windows)</span>
          </div>
        </div>
        <div class="modal-body">
          <div class="transfer-summary">
            <div class="summary-left">
              <span class="summary-count" id="consentFileCount">0 files</span>
              <span class="summary-dot">&bull;</span>
              <span class="summary-size" id="consentTotalSize">0 MB</span>
            </div>
            <span class="room-badge" id="consentRoomBadge" style="display: none;">Public</span>
          </div>
          <div class="modal-file-list" id="consentFileList">
            <!-- Dynamically populated files -->
          </div>
        </div>
        <div class="modal-actions">
          <button id="consentDeclineBtn" class="modal-btn btn-decline">Decline</button>
          <button id="consentAcceptBtn" class="modal-btn btn-accept">Accept & Download</button>
        </div>
      </div>
    </div>

    <!-- Non-blocking Toast Feedback -->
    <div id="toast-container" aria-live="polite"></div>

    <script type="module" src="./script/renderer.js"></script>
  </body>
</html>
